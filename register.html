<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bots Hub Pay · Register</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="register-style.css">
    <link rel="icon" href="assets/images/favicon.ico">
</head>
<body>
    <div class="register-page" id="registerPage">
        <div class="register-box">
            <div class="logo">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h1>Create Account</h1>
            <p class="subtitle">
                <i class="fa-regular fa-circle-check" style="margin-right: 6px; color: #4169ff;"></i>
                Join Bots Hub Pay
            </p>
            <form id="registerForm">
                <div class="input-group">
                    <label><i class="fa-regular fa-circle-user" style="margin-right: 6px;"></i> Full Name</label>
                    <div class="input-box">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="regFullName" placeholder="Enter your full name" required>
                    </div>
                </div>
                <div class="input-group">
                    <label><i class="fa-solid fa-phone" style="margin-right: 6px;"></i> Phone Number</label>
                    <div class="input-box">
                        <i class="fa-solid fa-phone"></i>
                        <input type="tel" id="regPhone" placeholder="Enter phone number" required maxlength="10">
                    </div>
                </div>
                <div class="input-group">
                    <label><i class="fa-regular fa-envelope" style="margin-right: 6px;"></i> Email</label>
                    <div class="input-box">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="regEmail" placeholder="Enter email address" required>
                    </div>
                </div>
                <div class="input-group">
                    <label><i class="fa-solid fa-lock" style="margin-right: 6px;"></i> Password</label>
                    <div class="input-box">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="regPassword" placeholder="Create password" required>
                    </div>
                </div>
                <div class="input-group">
                    <label><i class="fa-solid fa-lock" style="margin-right: 6px;"></i> Confirm Password</label>
                    <div class="input-box">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="regConfirmPassword" placeholder="Confirm password" required>
                    </div>
                </div>
                <button type="submit" id="registerBtn">
                    <i class="fa-solid fa-user-check"></i> Create Account
                </button>
                <div class="register-link">
                    <p>Already have an account?</p>
                    <a href="index.html" class="register-btn">Sign In</a>
                </div>
                <div class="footer-text">
                    <i class="fa-regular fa-copyright" style="margin-right: 4px;"></i> 2026 Bots Hub Pay
                </div>
            </form>
        </div>
    </div>
    <script src="js/register.js"></script>
</body>
</html>
