<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password · Bots Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="css/forgot-password-style.css">
    <link rel="icon" href="assets/images/favicon.ico">
</head>
<body>
    <div class="forgot-page" id="forgotPage">
        <div class="forgot-container">
            <div class="forgot-card">
                <div class="forgot-header">
                    <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
                    <h1><i class="fa-solid fa-key" style="color:#ff9100;"></i> Forgot Password</h1>
                </div>
                <div class="page-body">
                    <div class="step-indicator">
                        <div class="step-dot active" id="stepDot1">
                            <span class="dot"></span><span class="label">Phone</span>
                        </div>
                        <div class="step-line" id="stepLine1"></div>
                        <div class="step-dot" id="stepDot2">
                            <span class="dot"></span><span class="label">Verify</span>
                        </div>
                        <div class="step-line" id="stepLine2"></div>
                        <div class="step-dot" id="stepDot3">
                            <span class="dot"></span><span class="label">Reset</span>
                        </div>
                    </div>

                    <div class="step-content active" id="forgotStep1">
                        <p style="color:#6b7280; text-align:center; margin-bottom:1.5rem;">Enter your registered phone number.</p>
                        <div class="input-group">
                            <label>Phone Number</label>
                            <input type="tel" id="resetPhoneInput" placeholder="Enter registered phone number" maxlength="10">
                        </div>
                        <button class="btn-primary" id="sendCodeBtn"><i class="fa-solid fa-paper-plane"></i> Send Verification Code</button>
                    </div>

                    <div class="step-content" id="forgotStep2">
                        <p style="color:#6b7280; text-align:center; margin-bottom:1rem;">Enter the 6-digit verification code sent to</p>
                        <div class="phone-display" id="phoneDisplay">+91 **********</div>
                        <div class="verification-code-input" id="codeInputs">
                            <input type="text" maxlength="1" pattern="[0-9]" class="code-input" data-index="0">
                            <input type="text" maxlength="1" pattern="[0-9]" class="code-input" data-index="1">
                            <input type="text" maxlength="1" pattern="[0-9]" class="code-input" data-index="2">
                            <input type="text" maxlength="1" pattern="[0-9]" class="code-input" data-index="3">
                            <input type="text" maxlength="1" pattern="[0-9]" class="code-input" data-index="4">
                            <input type="text" maxlength="1" pattern="[0-9]" class="code-input" data-index="5">
                        </div>
                        <div class="resend-timer">Resend code in <span id="timerDisplay">30</span>s<br><a id="resendLink" style="display:none;" onclick="resendCode()">Resend Code</a></div>
                        <button class="btn-primary" id="verifyCodeBtn" style="margin-top:1rem;"><i class="fa-solid fa-check"></i> Verify Code</button>
                    </div>

                    <div class="step-content" id="forgotStep3">
                        <p style="color:#6b7280; text-align:center; margin-bottom:1.5rem;">Create a new password.</p>
                        <div class="input-group">
                            <label>New Password</label>
                            <input type="password" id="newPasswordInput" placeholder="Enter new password (min 6 characters)">
                        </div>
                        <div class="input-group">
                            <label>Confirm Password</label>
                            <input type="password" id="confirmPasswordInput" placeholder="Confirm new password">
                        </div>
                        <button class="btn-primary" id="resetPasswordBtn"><i class="fa-solid fa-rotate"></i> Reset Password</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/forgot-password.js"></script>
</body>
</html>
