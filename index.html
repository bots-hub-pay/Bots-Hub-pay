<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bots Hub Pay</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="assets/images/favicon.ico">
</head>
<body>
    <div class="login-page" id="loginPage">
        <div class="login-box">
            <div class="logo">
                <i class="fa-solid fa-robot"></i>
            </div>
            <h1>Bots Hub Pay</h1>
            <p class="subtitle">
                <i class="fa-regular fa-circle-check" style="margin-right: 6px; color: #4169ff;"></i>
                Secure Login Portal
            </p>
            <form id="loginForm">
                <div class="input-group">
                    <label><i class="fa-regular fa-circle-user" style="margin-right: 6px;"></i> Phone Number</label>
                    <div class="input-box">
                        <i class="fa-solid fa-phone"></i>
                        <input type="tel" id="loginPhone" placeholder="Enter phone number" required maxlength="10">
                    </div>
                </div>
                <div class="input-group">
                    <label><i class="fa-regular fa-keyboard" style="margin-right: 6px;"></i> Password</label>
                    <div class="input-box">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="loginPassword" placeholder="Enter password" required>
                    </div>
                </div>
                <div class="options">
                    <label>
                        <input type="checkbox" id="rememberMe" checked>
                        Remember me
                    </label>
                    <a href="forgot-password.html">Forgot?</a>
                </div>
                <button type="submit" id="loginBtn">
                    <i class="fa-solid fa-right-to-bracket"></i> Login
                </button>
                <div class="register-link">
                    <p>Don't have an account?</p>
                    <a href="register.html" class="register-btn">
                        <i class="fa-solid fa-user-plus"></i> Create Account
                    </a>
                </div>
            </form>
            <div class="footer-text">
                <i class="fa-regular fa-copyright" style="margin-right: 4px;"></i> 2026 Bots Hub Pay
            </div>
        </div>
    </div>
    <script src="js/login.js"></script>
</body>
</html>
