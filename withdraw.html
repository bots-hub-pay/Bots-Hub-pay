<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw · Bots Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="css/page-style.css">
    <link rel="icon" href="assets/images/favicon.ico">
</head>
<body>
    <div class="page-container">
        <div class="page-card">
            <div class="page-header">
                <a href="dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
                <h1><i class="fa-solid fa-arrow-right" style="color:#ff9100;"></i> Withdraw</h1>
            </div>
            <div class="page-body">
                <div class="balance-display">
                    <span>Available Balance</span>
                    <h2 id="currentBalance">₹0.00</h2>
                </div>
                <form id="withdrawForm">
                    <div class="input-group">
                        <label>Amount (₹ INR)</label>
                        <input type="number" id="withdrawAmount" placeholder="Enter amount" min="1" step="1" required>
                    </div>
                    <div class="quick-amounts">
                        <button type="button" class="quick-btn" data-amount="100">₹100</button>
                        <button type="button" class="quick-btn" data-amount="500">₹500</button>
                        <button type="button" class="quick-btn" data-amount="1000">₹1,000</button>
                        <button type="button" class="quick-btn" data-amount="2000">₹2,000</button>
                        <button type="button" class="quick-btn" data-amount="5000">₹5,000</button>
                        <button type="button" class="quick-btn" data-amount="10000">₹10,000</button>
                    </div>
                    <div class="input-group">
                        <label>Withdraw Method</label>
                        <select id="withdrawMethod" required>
                            <option value="">Select withdraw method</option>
                            <option value="bank">Bank Transfer</option>
                            <option value="upi">UPI</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Account Details</label>
                        <input type="text" id="accountDetails" placeholder="Enter account number / UPI ID" required>
                    </div>
                    <div class="input-group">
                        <label>Transaction PIN (4 digits)</label>
                        <input type="password" id="withdrawPin" placeholder="Enter 4-digit PIN" maxlength="4" pattern="[0-9]{4}" required>
                    </div>
                    <button type="submit" class="btn-primary">
                        <i class="fa-solid fa-arrow-right"></i> Request Withdraw
                    </button>
                    <p style="text-align:center;font-size:0.75rem;color:#6b7280;margin-top:0.5rem;">
                        <i class="fa-regular fa-clock"></i> Request will be approved by owner
                    </p>
                </form>
            </div>
        </div>
    </div>
    <script src="js/withdraw.js"></script>
</body>
</html>
