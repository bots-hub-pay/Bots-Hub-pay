<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction History · Bots Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="css/page-style.css">
    <link rel="icon" href="assets/images/favicon.ico">
    <style>
        .page-container {
            max-width: 100% !important;
            padding: 0 !important;
        }
        .page-card {
            border-radius: 0 !important;
            box-shadow: none !important;
            padding: 1.5rem !important;
            min-height: 100vh;
        }
        .transaction-list {
            max-height: 600px;
            overflow-y: auto;
        }
        .transaction-list::-webkit-scrollbar { width: 6px; }
        .transaction-list::-webkit-scrollbar-track { background: #f0f2f5; border-radius: 10px; }
        .transaction-list::-webkit-scrollbar-thumb { background: #4169ff; border-radius: 10px; }
        .transaction-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.8rem;
            border-bottom: 1px solid #f0f2f5;
            transition: background 0.3s ease;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .transaction-item:hover { background: #f8fafc; }
        .transaction-left { display: flex; align-items: center; gap: 1rem; flex: 1; }
        .transaction-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .transaction-icon.add { background: rgba(0,200,83,0.1); color: #00c853; }
        .transaction-icon.withdraw { background: rgba(255,145,0,0.1); color: #ff9100; }
        .transaction-icon.sent { background: rgba(106,75,255,0.1); color: #6a4bff; }
        .transaction-icon.received { background: rgba(65,105,255,0.1); color: #4169ff; }
        .transaction-icon.pending { background: rgba(255,145,0,0.1); color: #ff9100; }
        .transaction-details { flex: 1; }
        .transaction-details .desc { font-weight: 500; color: #1a1a2e; font-size: 0.9rem; }
        .transaction-details .time { font-size: 0.75rem; color: #6b7280; }
        .transaction-amount { font-weight: 600; font-size: 0.95rem; }
        .transaction-amount.add { color: #00c853; }
        .transaction-amount.withdraw { color: #ff9100; }
        .transaction-amount.sent { color: #6a4bff; }
        .transaction-amount.received { color: #4169ff; }
        .transaction-amount.pending { color: #ff9100; }
        .status-badge {
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .status-badge.approved { background: rgba(0,200,83,0.15); color: #00c853; }
        .status-badge.pending { background: rgba(255,145,0,0.15); color: #ff9100; }
        .status-badge.rejected { background: rgba(255,23,68,0.15); color: #ff1744; }
        .filter-buttons {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 0.4rem 1rem;
            border: 1.5px solid #e5e9f0;
            border-radius: 20px;
            background: #fff;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }
        .filter-btn.active { background: #4169ff; color: #fff; border-color: #4169ff; }
        .filter-btn:hover:not(.active) { background: #f0f2f5; }
        .no-transactions { text-align: center; padding: 3rem; color: #6b7280; }
        .no-transactions i { font-size: 3rem; opacity: 0.3; margin-bottom: 1rem; }
        .transaction-count { font-size: 0.85rem; color: #6b7280; margin-bottom: 0.5rem; }
        .transaction-right { display: flex; align-items: center; gap: 0.8rem; }
        @media (max-width: 768px) {
            .page-card { padding: 1rem !important; }
            .transaction-item { flex-direction: column; align-items: stretch; }
            .transaction-left { flex-wrap: wrap; }
            .transaction-list { max-height: 500px; }
            .transaction-right { justify-content: space-between; width: 100%; }
        }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="page-card">
            <div class="page-header">
                <a href="dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
                <h1><i class="fa-solid fa-clock-rotate-left" style="color:#4169ff;"></i> Transaction History</h1>
            </div>
            <div class="page-body">
                <div class="transaction-count" id="transactionCount">0 transactions</div>
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="add">Added</button>
                    <button class="filter-btn" data-filter="withdraw">Withdrawn</button>
                    <button class="filter-btn" data-filter="sent">Sent</button>
                    <button class="filter-btn" data-filter="received">Received</button>
                    <button class="filter-btn" data-filter="pending">Pending</button>
                </div>
                <div class="transaction-list" id="transactionList">
                    <div class="no-transactions"><i class="fa-regular fa-clock"></i><p>No transactions found</p></div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/transaction-history.js"></script>
</body>
</html>
