<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pay to User · Bots Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="css/page-style.css">
    <link rel="icon" href="assets/images/favicon.ico">
    <style>
        .recipient-name {
            display: none;
            margin-top: 0.3rem;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 0.3rem 0.8rem;
            border-radius: 8px;
            background: #f8fafc;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="page-card">
            <div class="page-header">
                <a href="dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
                <h1><i class="fa-solid fa-paper-plane" style="color:#6a4bff;"></i> Pay to User</h1>
            </div>
            <div class="page-body">
                <div class="balance-display">
                    <span>Your Balance</span>
                    <h2 id="currentBalance">₹0.00</h2>
                </div>
                <form id="payUserForm">
                    <div class="input-group">
                        <label>Recipient Phone Number</label>
                        <input type="tel" id="recipientPhone" placeholder="Enter recipient phone number" required maxlength="10">
                        <div class="recipient-name" id="recipientNameDisplay"></div>
                    </div>
                    <div class="input-group">
                        <label>Amount (₹ INR)</label>
                        <input type="number" id="payAmount" placeholder="Enter amount" min="1" step="1" required>
                    </div>
                    <div class="input-group">
                        <label>Note (Optional)</label>
                        <input type="text" id="payNote" placeholder="Add a note...">
                    </div>
                    <div class="input-group">
                        <label>Transaction PIN (4 digits)</label>
                        <input type="password" id="payPin" placeholder="Enter 4-digit PIN" maxlength="4" pattern="[0-9]{4}" required>
                    </div>
                    <button type="submit" class="btn-primary">
                        <i class="fa-solid fa-paper-plane"></i> Send Payment
                    </button>
                    <p style="text-align:center;font-size:0.75rem;color:#6b7280;margin-top:0.5rem;">
                        <i class="fa-regular fa-clock"></i> Payment is instant, no approval needed
                    </p>
                </form>
            </div>
        </div>
    </div>
    <script src="js/pay-user.js"></script>
</body>
</html>
