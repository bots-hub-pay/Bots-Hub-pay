<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Fund · Bots Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="css/page-style.css">
    <link rel="stylesheet" href="css/add-fund-style.css">
    <link rel="icon" href="assets/images/favicon.ico">
</head>
<body>
    <div class="page-container">
        <div class="page-card">
            <div class="page-header">
                <a href="dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
                <h1><i class="fa-solid fa-circle-plus" style="color:#00c853;"></i> Add Fund</h1>
            </div>
            <div class="page-body">
                <div class="balance-display">
                    <span>Current Balance</span>
                    <h2 id="currentBalance">₹0.00</h2>
                </div>
                <form id="addFundForm">
                    <div class="input-group">
                        <label>Amount (₹ INR)</label>
                        <input type="number" id="fundAmount" placeholder="Enter amount" min="1" step="1" required>
                    </div>
                    <div class="quick-amounts">
                        <button type="button" class="quick-btn" data-amount="100">₹100</button>
                        <button type="button" class="quick-btn" data-amount="500">₹500</button>
                        <button type="button" class="quick-btn" data-amount="1000">₹1,000</button>
                        <button type="button" class="quick-btn" data-amount="2000">₹2,000</button>
                        <button type="button" class="quick-btn" data-amount="5000">₹5,000</button>
                        <button type="button" class="quick-btn" data-amount="10000">₹10,000</button>
                    </div>
                    <div class="input-group">
                        <label>UTR / Transaction ID</label>
                        <input type="text" id="utrId" placeholder="Enter UTR number" required>
                    </div>
                    <div class="input-group">
                        <label>Transaction PIN (4 digits)</label>
                        <input type="password" id="fundPin" placeholder="Enter 4-digit PIN" maxlength="4" pattern="[0-9]{4}" required>
                    </div>
                    <button type="submit" class="btn-primary">
                        <i class="fa-solid fa-circle-check"></i> Submit Request
                    </button>
                    <p style="text-align:center;font-size:0.75rem;color:#6b7280;margin-top:0.5rem;">
                        <i class="fa-regular fa-clock"></i> Request will be verified by owner
                    </p>
                </form>
            </div>
        </div>
    </div>
    <script src="js/add-fund.js"></script>
</body>
</html>
